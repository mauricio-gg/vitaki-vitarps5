name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only run on main branch

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Full history for changelog

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Get the latest tag, or default to v0.0.0 if no tags exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Calculate new version
        id: new_version
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
          VERSION_TYPE="${{ github.event.inputs.version_type }}"

          # Remove 'v' prefix if present
          VERSION=${LATEST_TAG#v}

          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Bump version based on type
          case $VERSION_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG"

      - name: Generate release notes
        id: changelog
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.LATEST_TAG }}"
          NEW_TAG="${{ steps.new_version.outputs.NEW_TAG }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)

          echo "Generating release notes from $LATEST_TAG to HEAD..."
          chmod +x tools/release_notes.sh
          tools/release_notes.sh "$LATEST_TAG" "$NEW_TAG" "VitaRPS5-${NEW_TAG}.vpk" \
            "${{ github.sha }}" "$BUILD_DATE" "${{ github.repository }}" "$RUNNER_TEMP/release_notes.md"

      - name: Build VPK using Docker (prod env)
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh --env prod

      - name: Find and rename VPK
        id: find_vpk
        run: |
          NEW_TAG="${{ steps.new_version.outputs.NEW_TAG }}"

          # Our build system creates VPK in ./build/
          VPK_FILE=$(find build -name "*.vpk" -type f | head -1)
          if [ -z "$VPK_FILE" ]; then
            echo "Error: No VPK file found!"
            exit 1
          fi

          # Create release name
          RELEASE_NAME="VitaRPS5-${NEW_TAG}.vpk"
          cp "$VPK_FILE" "$RELEASE_NAME"

          echo "VPK_PATH=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "VPK_NAME=$RELEASE_NAME" >> $GITHUB_OUTPUT

          # Show file info
          echo "Created VPK:"
          ls -lh "$RELEASE_NAME"

      - name: Create and push tag
        run: |
          NEW_TAG="${{ steps.new_version.outputs.NEW_TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitarps5-vpk-${{ steps.new_version.outputs.NEW_TAG }}
          path: ${{ steps.find_vpk.outputs.VPK_PATH }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_version.outputs.NEW_TAG }}
          name: VitaRPS5 ${{ steps.new_version.outputs.NEW_TAG }}
          files: ${{ steps.find_vpk.outputs.VPK_PATH }}
          body_path: ${{ runner.temp }}/release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stable-named VPK for latest release
        run: |
          cp "${{ steps.find_vpk.outputs.VPK_PATH }}" VitaRPS5-latest.vpk
          # Compatibility alias so download links to the old file name keep working
          cp "${{ steps.find_vpk.outputs.VPK_PATH }}" VitakiFork-latest.vpk

      - name: Update 'latest' release tag
        run: |
          git tag -f latest
          git push origin latest --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VitaRPS5 Latest (${{ steps.new_version.outputs.NEW_TAG }})
          files: |
            VitaRPS5-latest.vpk
            VitakiFork-latest.vpk
          body: |
            # VitaRPS5 Latest (currently ${{ steps.new_version.outputs.NEW_TAG }})

            **This release always points to the most recent stable build.**

            Stable download URL (never changes):
            `https://github.com/${{ github.repository }}/releases/download/latest/VitaRPS5-latest.vpk`

            (The old file name VitakiFork-latest.vpk is kept so existing links still work.)

            For version-specific release notes, see [${{ steps.new_version.outputs.NEW_TAG }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.new_version.outputs.NEW_TAG }}).
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
