name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - beta
        default: 'patch'

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only run on main branch

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Full history for changelog

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate version
        id: new_version
        run: tools/next_version.sh "${{ github.event.inputs.version_type }}" | tee -a "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: changelog
        run: |
          LATEST_TAG="${{ steps.new_version.outputs.LATEST_TAG }}"
          NEW_TAG="${{ steps.new_version.outputs.NEW_TAG }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)

          echo "Generating release notes from $LATEST_TAG to HEAD..."
          chmod +x tools/release_notes.sh
          tools/release_notes.sh "$LATEST_TAG" "$NEW_TAG" "VitaRPS5-${NEW_TAG}.vpk" \
            "${{ github.sha }}" "$BUILD_DATE" "${{ github.repository }}" "$RUNNER_TEMP/release_notes.md"

          if [ "${{ github.event.inputs.version_type }}" = beta ]; then
            {
              echo "> **Beta: this is a test build, not the stable release.** It is a pre-release for testing and logging is turned on."
              echo "> The log file is in \`ux0:data/vita-chiaki/\` and is named like \`<number>_vitarps5-testing.log\`."
              echo "> To report a problem, open a GitHub issue on this repository and attach the log."
              echo
              cat "$RUNNER_TEMP/release_notes.md"
            } > "$RUNNER_TEMP/release_notes_beta.md"
            mv "$RUNNER_TEMP/release_notes_beta.md" "$RUNNER_TEMP/release_notes.md"
          fi

      - name: Build VPK using Docker
        env:
          VITARPS5_RELEASE_VERSION: ${{ steps.new_version.outputs.NEW_VERSION }}
        run: |
          chmod +x tools/build.sh
          # Betas build with logging on (testing); stable releases with prod.
          if [ "${{ github.event.inputs.version_type }}" = beta ]; then
            ./tools/build.sh --env testing
          else
            ./tools/build.sh --env prod
          fi

      - name: Find and rename VPK
        id: find_vpk
        run: |
          NEW_TAG="${{ steps.new_version.outputs.NEW_TAG }}"

          # Our build system creates VPK in ./build/
          VPK_FILE=$(find build -name "*.vpk" -type f | head -1)
          if [ -z "$VPK_FILE" ]; then
            echo "Error: No VPK file found!"
            exit 1
          fi

          # Create release name
          RELEASE_NAME="VitaRPS5-${NEW_TAG}.vpk"
          cp "$VPK_FILE" "$RELEASE_NAME"

          # Stable-named copy, attached to every stable release (never a beta) so
          # /releases/latest/download/VitaRPS5-latest.vpk is a permanent link
          if [ "${{ github.event.inputs.version_type }}" != beta ]; then
            cp "$VPK_FILE" VitaRPS5-latest.vpk
          fi

          echo "VPK_PATH=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "VPK_NAME=$RELEASE_NAME" >> $GITHUB_OUTPUT

          # Show file info
          echo "Created VPK:"
          ls -lh "$RELEASE_NAME"

      - name: Create and push tag
        run: |
          NEW_TAG="${{ steps.new_version.outputs.NEW_TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitarps5-vpk-${{ steps.new_version.outputs.NEW_TAG }}
          path: ${{ steps.find_vpk.outputs.VPK_PATH }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_version.outputs.NEW_TAG }}
          name: VitaRPS5 ${{ steps.new_version.outputs.NEW_TAG }}
          files: |
            ${{ steps.find_vpk.outputs.VPK_PATH }}
            ${{ github.event.inputs.version_type != 'beta' && 'VitaRPS5-latest.vpk' || '' }}
          body_path: ${{ runner.temp }}/release_notes.md
          draft: false
          prerelease: ${{ github.event.inputs.version_type == 'beta' }}
          make_latest: ${{ github.event.inputs.version_type != 'beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
