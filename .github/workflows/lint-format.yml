# Lint, Format & Native Tests workflow
#
# Runs on every PR (any branch) and every push to main.
# Lint/format scope: vita/src/ and vita/include/ only.  lib/ and third-party/ are upstream Chiaki — excluded.
# The redaction job compiles and runs test/redact_tests.c natively (build.sh test never runs tests, #222).
# The latency policy job does the same for test/latency_policy_tests.c (#420).
# The manual host discovery job does the same for test/manual_host_discovery_tests.c (#234).
# The ui connection IP job does the same for test/ui_connection_ip_tests.c (#94).
#
# Tool versions:
#   clang-format: installed via pip (PyPI package "clang-format" by ssciwr) at the exact
#                 version pinned in both this file and the repo Dockerfile.  The PyPI wheel
#                 ships an official LLVM binary — this image and the GitHub Actions runners
#                 share the same glibc/Ubuntu libc family, so no ABI mismatch is possible.
#                 Pin: 19.1.5  — update in BOTH places together when upgrading.
#   cppcheck:     installed via apt in the lint job below.
#
# All jobs run in parallel so each posts its own status check to the PR.

name: Lint & Format

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: clang-format dry-run
  # Installs clang-format==19.1.5 from PyPI (same version baked into the repo
  # Dockerfile), then runs a --dry-run --Werror pass over vita/src/ and
  # vita/include/.  Any file that would be reformatted causes a non-zero exit.
  # This job completes in well under 30 seconds — no Docker build required.
  # ---------------------------------------------------------------------------
  format-check:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned clang-format
        # Version must match the pin in Dockerfile (clang-format==19.1.5).
        # The PyPI wheel ships an official LLVM binary, and this runner now
        # shares the same glibc/Ubuntu libc family as the local Docker image,
        # so formatter output stays identical.
        run: pip install clang-format==19.1.5

      - name: Verify clang-format version
        run: clang-format --version

      - name: Check formatting (dry-run)
        # --dry-run --Werror: exit non-zero if any file differs from formatted output.
        # No files are modified; a failure means the PR needs a reformat commit.
        run: |
          find vita/src vita/include -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror -style=file

  # ---------------------------------------------------------------------------
  # Job 2: cppcheck static analysis
  # Uses --enable=warning,performance,portability (not --enable=all) to avoid
  # noisy style/information categories (unreadVariable, unusedStructMember,
  # checkersReport) that produce false positives when Vita SDK headers are
  # absent.  Real bug classes (null-pointer, memory leaks, undefined behaviour)
  # are all covered by the warning and portability checkers.
  # Suppression list at .cppcheck-suppressions handles the remaining categories
  # that are noise in a cross-compiled Vita project (missingInclude, etc.).
  # ---------------------------------------------------------------------------
  lint:
    name: cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cppcheck

      - name: Verify cppcheck version
        run: cppcheck --version

      - name: Run cppcheck
        # --enable=warning,performance,portability  - real bug classes only; no style noise
        # --std=c99               - match VitaSDK's C standard
        # --language=c            - treat all files as C (avoids .h ambiguity)
        # --inline-suppr          - honour // cppcheck-suppress comments in source
        # --suppressions-list=... - project-level suppressions file
        # --error-exitcode=1      - fail CI on any finding (strict gatekeeping)
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c99 \
            --language=c \
            --inline-suppr \
            --suppressions-list=.cppcheck-suppressions \
            --error-exitcode=1 \
            -I vita/include \
            -I lib/include \
            vita/src/ \
            vita/include/

  # ---------------------------------------------------------------------------
  # Job 3: redaction tests
  # `./tools/build.sh test` only cross-compiles for the Vita and never runs the
  # result (#222), so this job builds test/redact_tests.c with the runner's cc
  # and runs it.  A failed assert aborts the binary and fails the job.
  # Flags and sources match the build comment at the top of the test file.
  # ---------------------------------------------------------------------------
  redact-tests:
    name: redaction tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build and run redaction tests
        run: |
          cc -std=c99 -I lib/include test/redact_tests.c lib/src/redact.c lib/src/log.c \
            -o "$RUNNER_TEMP/redact_tests"
          "$RUNNER_TEMP/redact_tests"

  # ---------------------------------------------------------------------------
  # Job 4: latency policy tests (#420)
  # Same reasoning as the redaction job: build.sh test never runs anything, so
  # build test/latency_policy_tests.c with the runner's cc and run it.
  # Flags and sources match the build comment at the top of the test file.
  # ---------------------------------------------------------------------------
  latency-policy-tests:
    name: latency policy tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build and run latency policy tests
        run: |
          cc -std=c99 -Wall -Wextra -I vita/include \
            test/latency_policy_tests.c vita/src/latency_policy.c \
            -o "$RUNNER_TEMP/latency_policy_tests"
          "$RUNNER_TEMP/latency_policy_tests"

  # ---------------------------------------------------------------------------
  # Job 5: manual host discovery tests (#234)
  # Same reasoning as the jobs above: build.sh test never runs anything, so build
  # test/manual_host_discovery_tests.c with the runner's cc and run it.
  # Flags and sources match the build comment at the top of the test file.
  # ---------------------------------------------------------------------------
  manual-host-discovery-tests:
    name: manual host discovery tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # vita/third_party/tomlc99 is a submodule; the test builds config_hosts.c against it.
      - name: Fetch tomlc99 submodule
        run: git submodule update --init vita/third_party/tomlc99

      - name: Build and run manual host discovery tests
        run: |
          cc -std=gnu11 -Wall -Wextra -I test/stubs/manual_hosts -I vita/include -I lib/include \
            -I lib/src -I vita/third_party test/manual_host_discovery_tests.c vita/src/discovery.c \
            vita/src/host_storage.c vita/src/config_hosts.c vita/src/discovery_host.c \
            vita/third_party/tomlc99/toml.c lib/src/base64.c \
            -o "$RUNNER_TEMP/manual_host_discovery_tests"
          "$RUNNER_TEMP/manual_host_discovery_tests"

  # ---------------------------------------------------------------------------
  # Job: ui connection IP tests (#94)
  # A PSN console's Console IP must be its display address, never its name. Compiles
  # test/ui_connection_ip_tests.c with the runner's cc and runs it.
  # Flags and sources match the build comment at the top of the test file.
  # ---------------------------------------------------------------------------
  ui-connection-ip-tests:
    name: ui connection IP tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # vita/include/room_icons.h includes tomlc99/toml.h from the vita/third_party submodule.
      - name: Fetch tomlc99 submodule
        run: git submodule update --init vita/third_party/tomlc99

      - name: Build and run ui connection IP tests
        run: |
          cc -std=gnu11 -Wall -Wextra -I test/stubs/manual_hosts -I vita/include -I lib/include \
            -I lib/src -I vita/third_party test/ui_connection_ip_tests.c \
            vita/src/ui/ui_value_labels.c vita/src/ui/ui_console_status.c vita/src/ip_address.c \
            -o "$RUNNER_TEMP/ui_connection_ip_tests"
          "$RUNNER_TEMP/ui_connection_ip_tests"
